<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accurate Periodic Table</title>
    <style>
        /* --- General Layout --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ecf0f1;
            margin: 0;
            padding: 20px;
        }

        h1 { text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #95a5a6; margin-bottom: 20px; }

        /* --- Controls --- */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        #searchInput {
            padding: 12px 20px;
            border-radius: 25px;
            border: none;
            background: #333;
            color: white;
            font-size: 1rem;
            outline: none;
            width: 300px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        button#langBtn {
            padding: 12px 20px;
            border-radius: 25px;
            border: none;
            background: #3498db;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button#langBtn:hover { background: #2980b9; }

        /* --- Periodic Table Grid --- */
        .periodic-table-wrapper {
            overflow-x: auto;
            padding-bottom: 60px;
        }

        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 60px);
            grid-template-rows: repeat(10, 60px);
            gap: 4px;
            width: max-content;
            margin: 0 auto;
        }

        /* --- Element Card Styling --- */
        .element {
            background: #2c3e50;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, opacity 0.2s;
            position: relative;
            user-select: none;
        }

        .element:hover {
            transform: scale(1.5);
            z-index: 100;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            border-color: #fff;
        }

        .element.dimmed { opacity: 0.1; pointer-events: none; transform: scale(1); }

        .at-num { font-size: 8px; position: absolute; top: 2px; left: 3px; color: #bdc3c7; }
        .symbol { font-size: 16px; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .name { font-size: 7px; text-align: center; overflow: hidden; white-space: nowrap; width: 90%; text-overflow: ellipsis; }

        /* --- Category Colors --- */
        .cat-alkali { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .cat-alkaline { background: linear-gradient(135deg, #e67e22, #d35400); }
        .cat-transition { background: linear-gradient(135deg, #34495e, #2c3e50); }
        .cat-post-trans { background: linear-gradient(135deg, #3498db, #2980b9); }
        .cat-metalloid { background: linear-gradient(135deg, #1abc9c, #16a085); }
        .cat-non-metal { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .cat-halogen { background: linear-gradient(135deg, #f1c40f, #f39c12); color: #333; }
        .cat-noble { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .cat-lanthanide { background: linear-gradient(135deg, #ff9ff3, #f368e0); color: #333; }
        .cat-actinide { background: linear-gradient(135deg, #ffcccc, #ffaf40); color: #333; }

        .placeholder {
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: #7f8c8d; border: 1px dashed #555; border-radius: 4px;
        }

        /* --- MODAL (POP-UP) STYLING --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #2c3e50;
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 450px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            color: white;
            border: 1px solid #555;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
        }
        .modal-close:hover { color: white; }

        .modal-header { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .modal-symbol { font-size: 3rem; font-weight: bold; background: rgba(0,0,0,0.2); padding: 5px 20px; border-radius: 10px; }
        .modal-title { text-align: left; }
        .modal-name { font-size: 1.5rem; font-weight: bold; margin: 0; }
        .modal-cat { font-size: 0.9rem; text-transform: uppercase; color: #ddd; }
        
        .modal-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
            background: rgba(0,0,0,0.15);
            padding: 15px;
            border-radius: 10px;
            text-align: left;
        }
        
        .detail-item { display: flex; flex-direction: column; }
        .detail-item strong { font-size: 0.7rem; color: #95a5a6; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
        .detail-item span { font-size: 0.95rem; font-weight: 500; color: #fff;}
        
        /* Make oxidation states span full width */
        .full-width { grid-column: 1 / -1; }

        .wiki-btn {
            display: inline-block;
            background: #2980b9;
            color: white;
            padding: 10px 25px;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .wiki-btn:hover { background: #3498db; transform: translateY(-2px); }

    </style>
</head>

        // --- GRID LOGIC ---
        function getPosition(n) {
            if(n===1) return [1,1]; if(n===2) return [1,18];
            if(n>=3 && n<=4) return [2, n-2]; if(n>=5 && n<=10) return [2, n+8];
            if(n>=11 && n<=12) return [3, n-10]; if(n>=13 && n<=18) return [3, n];
            if(n>=19 && n<=36) return [4, n-18];
            if(n>=37 && n<=54) return [5, n-36];
            if(n>=55 && n<=56) return [6, n-54]; if(n>=72 && n<=86) return [6, n-68];
            if(n>=87 && n<=88) return [7, n-86]; if(n>=104 && n<=118) return [7, n-100];
            if(n>=57 && n<=71) return [9, n-54];
            if(n>=89 && n<=103) return [10, n-86];
            return [1,1];
        }

        // --- PHASE LOGIC ---
        function getPhase(sym, lang) {
            // Simplified standard phase at STP
            const gases = ['H','He','N','O','F','Ne','Cl','Ar','Kr','Xe','Rn','Og'];
            const liquids = ['Br','Hg','Cn']; 
            if (gases.includes(sym)) return lang === 'en' ? 'Gas' : 'Gaz';
            if (liquids.includes(sym)) return lang === 'en' ? 'Liquid' : 'Ciecz';
            return lang === 'en' ? 'Solid' : 'Ciało stałe';
        }

        // --- RENDER TABLE ---
        function renderTable() {
            const container = document.getElementById('tableGrid');
            container.innerHTML = `
                <div class="placeholder" style="grid-column: 3; grid-row: 6;">57-71</div>
                <div class="placeholder" style="grid-column: 3; grid-row: 7;">89-103</div>
            `;

            rawData.forEach(data => {
                const [num, sym, nameEn, namePl, cat] = data; // Destructuring just the basics for the grid
                const [row, col] = getPosition(num);
                const displayName = currentLang === 'en' ? nameEn : namePl;

                const el = document.createElement('div');
                el.className = `element ${cat}`;
                el.style.gridRow = row;
                el.style.gridColumn = col;
                
                el.dataset.nameEn = nameEn.toLowerCase();
                el.dataset.namePl = namePl.toLowerCase();
                el.dataset.sym = sym.toLowerCase();
                el.dataset.num = num;

                el.innerHTML = `<span class="at-num">${num}</span><span class="symbol">${sym}</span><span class="name">${displayName}</span>`;
                el.onclick = () => openModal(data);
                
                container.appendChild(el);
            });
        }

        // --- MODAL FUNCTIONS ---
        function openModal(data) {
            const [num, sym, nameEn, namePl, catClass, mass, neg, ox] = data;
            const name = currentLang === 'en' ? nameEn : namePl;
            const catName = catClass.replace('cat-','').toUpperCase().replace('-',' ');
            
            document.getElementById('mSym').innerText = sym;
            document.getElementById('mName').innerText = name;
            document.getElementById('mCat').innerText = catName;
            document.getElementById('mNum').innerText = num;
            document.getElementById('mMass').innerText = mass;
            document.getElementById('mPhase').innerText = getPhase(sym, currentLang);
            document.getElementById('mNeg').innerText = neg;
            document.getElementById('mOx').innerText = ox;

            // Color matching
            const colorMap = getComputedStyle(document.querySelector(`.${catClass}`)).background;
            document.getElementById('mSym').style.background = colorMap;

            // Wiki Link
            const wikiLang = currentLang === 'en' ? 'en' : 'pl';
            document.getElementById('mWiki').href = `https://${wikiLang}.wikipedia.org/wiki/${name}`;
            document.getElementById('mWiki').innerText = currentLang === 'en' ? 'Read on Wikipedia' : 'Czytaj na Wikipedii';

            // Labels translation
            document.getElementById('lblNum').innerText = currentLang === 'en' ? 'Atomic Number' : 'Liczba atomowa';
            document.getElementById('lblMass').innerText = currentLang === 'en' ? 'Atomic Mass' : 'Masa atomowa';
            document.getElementById('lblPhase').innerText = currentLang === 'en' ? 'Phase (STP)' : 'Stan skupienia';
            document.getElementById('lblNeg').innerText = currentLang === 'en' ? 'Electronegativity (Pauling)' : 'Elektroujemność (Pauling)';
            document.getElementById('lblOx').innerText = currentLang === 'en' ? 'Oxidation States' : 'Stopnie utlenienia';

            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal(event) {
            if (event === 'force' || event.target.id === 'modalOverlay') {
                document.getElementById('modalOverlay').style.display = 'none';
            }
        }

        // --- LANGUAGE & SEARCH ---
        function toggleLanguage() {
            const btn = document.getElementById('langBtn');
            const title = document.getElementById('pageTitle');
            const subtitle = document.getElementById('pageSubtitle');
            const search = document.getElementById('searchInput');

            if (currentLang === 'en') {
                currentLang = 'pl';
                btn.textContent = 'English'; 
                title.textContent = 'Układ Okresowy Pierwiastków';
                subtitle.textContent = 'Dane zweryfikowane naukowo';
                search.placeholder = 'Szukaj (np. Złoto, Fe, 26)...';
            } else {
                currentLang = 'en';
                btn.textContent = 'Polski';
                title.textContent = 'Corrected Periodic Table';
                subtitle.textContent = 'Data verified against scientific standards';
                search.placeholder = 'Highlight element (e.g. Carbon, Au)...';
            }
            renderTable();
            filterElements();
        }

        function filterElements() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const elements = document.querySelectorAll('.element');

            elements.forEach(el => {
                el.style.transform = ""; el.style.zIndex = "";
                const nameKey = currentLang === 'en' ? 'nameEn' : 'namePl';
                const match = el.dataset[nameKey].includes(query) || el.dataset.sym.includes(query) || el.dataset.num === query;
                if (query === "") el.classList.remove('dimmed');
                else if (match) el.classList.remove('dimmed');
                else el.classList.add('dimmed');
            });
        }

        renderTable();
    </script>
</body>
</html>
