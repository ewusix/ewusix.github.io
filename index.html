<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Periodic Catalogue</title>
    <style>
        /* --- General Styling --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px;
        }

        h1 { text-align: center; color: #2c3e50; margin-bottom: 10px; }
        p.subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; }

        /* --- Search Bar Styling --- */
        .search-container {
            max-width: 600px;
            margin: 0 auto 40px auto;
            position: relative;
        }

        #searchInput {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1rem;
            border: 2px solid #ddd;
            border-radius: 30px;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        #searchInput:focus {
            border-color: #3498db;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.2);
        }

        /* --- Grid Layout --- */
        .catalogue {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- Card Styling --- */
        .element-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
            transition: transform 0.2s;
            position: relative;
            cursor: pointer;
            border-top: 5px solid #ccc;
        }

        .element-card:hover { transform: translateY(-3px); }

        .number { font-size: 0.8rem; color: #999; position: absolute; top: 10px; left: 10px; }
        .mass { font-size: 0.75rem; color: #999; position: absolute; top: 10px; right: 10px; }
        
        .symbol {
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            margin-top: 20px;
            color: #34495e;
        }

        .name {
            text-align: center;
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cat-name {
            text-align: center;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #aaa;
            letter-spacing: 0.5px;
        }

        /* --- Dynamic Categories Colors --- */
        .c-non-metal { border-color: #2ecc71; } .c-non-metal .symbol { color: #27ae60; }
        .c-noble-gas { border-color: #9b59b6; } .c-noble-gas .symbol { color: #8e44ad; }
        .c-alkali { border-color: #e74c3c; } .c-alkali .symbol { color: #c0392b; }
        .c-alkaline-earth { border-color: #e67e22; } .c-alkaline-earth .symbol { color: #d35400; }
        .c-metalloid { border-color: #1abc9c; } .c-metalloid .symbol { color: #16a085; }
        .c-halogen { border-color: #f1c40f; } .c-halogen .symbol { color: #f39c12; }
        .c-transition { border-color: #34495e; } .c-transition .symbol { color: #2c3e50; }
        .c-post-transition { border-color: #3498db; } .c-post-transition .symbol { color: #2980b9; }
        .c-lanthanide { border-color: #ff9ff3; } .c-lanthanide .symbol { color: #ff6b6b; }
        .c-actinide { border-color: #ffcccc; } .c-actinide .symbol { color: #ff9f43; }

    </style>

        // --- 2. Function to Render Elements ---
        function renderElements(list) {
            const container = document.getElementById('gridContainer');
            container.innerHTML = ''; // Clear existing content

            list.forEach(el => {
                const [num, symbol, name, mass, catClass, catName] = el;
                
                const card = document.createElement('div');
                card.className = `element-card ${catClass}`;
                card.innerHTML = `
                    <span class="number">${num}</span>
                    <span class="mass">${mass}</span>
                    <div class="symbol">${symbol}</div>
                    <div class="name">${name}</div>
                    <div class="cat-name">${catName}</div>
                `;
                container.appendChild(card);
            });
        }

        // --- 3. Filter Function ---
        function filterElements() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = elementsData.filter(el => {
                const [num, symbol, name] = el;
                return name.toLowerCase().includes(query) || 
                       symbol.toLowerCase().includes(query) || 
                       num.toString().includes(query);
            });

            renderElements(filtered);
        }

        // --- 4. Initial Load ---
        renderElements(elementsData);
