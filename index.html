<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Periodic Table</title>
    <style>
        /* --- General Layout --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a; /* Dark mode for better contrast */
            color: #ecf0f1;
            margin: 0;
            padding: 20px;
        }

        h1 { text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #95a5a6; margin-bottom: 20px; }

        /* --- Search Bar --- */
        .search-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        #searchInput {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border-radius: 25px;
            border: none;
            background: #333;
            color: white;
            font-size: 1rem;
            outline: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* --- Periodic Table Grid --- */
        .periodic-table-wrapper {
            overflow-x: auto; /* Allows scrolling on mobile */
            padding-bottom: 20px;
        }

        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 60px); /* 18 fixed columns */
            grid-template-rows: repeat(10, 60px);    /* 7 main rows + 3 spacing/extra */
            gap: 4px;
            width: max-content;
            margin: 0 auto;
        }

        /* --- Element Card Styling --- */
        .element {
            background: #2c3e50;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, z-index 0.2s;
            position: relative;
            user-select: none;
        }

        /* Hover Effect: Scale up and sit on top */
        .element:hover {
            transform: scale(1.5);
            z-index: 10;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            border-color: #fff;
        }

        /* Dim elements when searching */
        .element.dimmed {
            opacity: 0.1;
            pointer-events: none;
        }

        .at-num {
            font-size: 8px;
            position: absolute;
            top: 2px;
            left: 3px;
            color: #bdc3c7;
        }

        .symbol {
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .name {
            font-size: 7px;
            text-align: center;
            overflow: hidden;
            white-space: nowrap;
            width: 90%;
            text-overflow: ellipsis;
        }

        /* --- Color Categories (Subtle Gradients) --- */
        .cat-alkali { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .cat-alkaline { background: linear-gradient(135deg, #e67e22, #d35400); }
        .cat-transition { background: linear-gradient(135deg, #34495e, #2c3e50); }
        .cat-post-trans { background: linear-gradient(135deg, #3498db, #2980b9); }
        .cat-metalloid { background: linear-gradient(135deg, #1abc9c, #16a085); }
        .cat-non-metal { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .cat-halogen { background: linear-gradient(135deg, #f1c40f, #f39c12); color: #333; }
        .cat-noble { background: linear-gradient(135deg, #9b59b6, #8e44ad); }
        .cat-lanthanide { background: linear-gradient(135deg, #ff9ff3, #f368e0); color: #333; }
        .cat-actinide { background: linear-gradient(135deg, #ffcccc, #ffaf40); color: #333; }

        /* Placeholders for Lanthanides/Actinides labels in main table */
        .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #7f8c8d;
            border: 1px dashed #555;
            border-radius: 4px;
        }

        /* Responsive note */
        @media (max-width: 800px) {
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    
    

[Image of Periodic Table of Elements]


    <h1>Interactive Periodic Table</h1>
    <p class="subtitle">Scroll horizontally to view the full table</p>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Highlight element (e.g. 'Carbon', 'Au')..." onkeyup="filterElements()">
    </div>

    <div class="periodic-table-wrapper">
        <div class="periodic-table" id="tableGrid">
            <div class="placeholder" style="grid-column: 3; grid-row: 6;">57-71</div>
            <div class="placeholder" style="grid-column: 3; grid-row: 7;">89-103</div>
        </div>
    </div>

    <script>
        // --- DATA: [Number, Symbol, Name, Category Class] ---
        const rawData = [

            // Continue Main Block

            [106,"Sg","Seaborgium","cat-transition"],
            [107,"Bh","Bohrium","cat-transition"],
            [108,"Hs","Hassium","cat-transition"],
            [109,"Mt","Meitnerium","cat-transition"],
            [110,"Ds","Darmstadtium","cat-transition"],
            [111,"Rg","Roentgenium","cat-transition"],
            [112,"Cn","Copernicium","cat-transition"],
            [113,"Nh","Nihonium","cat-post-trans"],
            [114,"Fl","Flerovium","cat-post-trans"],
            [115,"Mc","Moscovium","cat-post-trans"],
            [116,"Lv","Livermorium","cat-post-trans"],
            [117,"Ts","Tennessine","cat-halogen"],
            [118,"Og","Oganesson","cat-noble"]
        ];

        // --- POSITION LOGIC ---
        // This function determines where each element sits on the 18x10 grid
        function getPosition(atomicNumber) {
            const n = atomicNumber;
            // Row 1
            if(n===1) return [1,1];
            if(n===2) return [1,18];
            // Row 2
            if(n>=3 && n<=4) return [2, n-2];
            if(n>=5 && n<=10) return [2, n+8];
            // Row 3
            if(n>=11 && n<=12) return [3, n-10];
            if(n>=13 && n<=18) return [3, n+2];
            // Row 4
            if(n>=19 && n<=36) return [4, n-18];
            // Row 5
            if(n>=37 && n<=54) return [5, n-36];
            // Row 6 (includes split for Lanthanides)
            if(n>=55 && n<=56) return [6, n-54];
            if(n>=72 && n<=86) return [6, n-68]; // Offset for gap
            // Row 7 (includes split for Actinides)
            if(n>=87 && n<=88) return [7, n-86];
            if(n>=104 && n<=118) return [7, n-100]; // Offset for gap
            
            // Lanthanides (Row 9, offset 3)
            if(n>=57 && n<=71) return [9, n-54];
            // Actinides (Row 10, offset 3)
            if(n>=89 && n<=103) return [10, n-86];

            return [1,1]; // Fallback
        }

        function renderTable() {
            const container = document.getElementById('tableGrid');
            
            // Generate Element Cards
            rawData.forEach(data => {
                const [num, sym, name, cat] = data;
                const [row, col] = getPosition(num);

                const el = document.createElement('div');
                el.className = `element ${cat}`;
                el.style.gridRow = row;
                el.style.gridColumn = col;
                // Add data attributes for search
                el.dataset.name = name.toLowerCase();
                el.dataset.sym = sym.toLowerCase();
                el.dataset.num = num;

                el.innerHTML = `
                    <span class="at-num">${num}</span>
                    <span class="symbol">${sym}</span>
                    <span class="name">${name}</span>
                `;
                
                // Click alert (Simple interactivity)
                el.onclick = () => alert(`${name} (${sym})\nAtomic Number: ${num}\nCategory: ${cat.replace('cat-','').toUpperCase()}`);
                
                container.appendChild(el);
            });
        }

        function filterElements() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const elements = document.querySelectorAll('.element');

            elements.forEach(el => {
                const match = el.dataset.name.includes(query) || 
                              el.dataset.sym.includes(query) || 
                              el.dataset.num === query;
                
                // Toggle "dimmed" class instead of removing from DOM to keep table shape
                if (query === "") {
                    el.classList.remove('dimmed');
                } else if (match) {
                    el.classList.remove('dimmed');
                    el.style.transform = "scale(1.2)";
                    el.style.zIndex = "100";
                } else {
                    el.classList.add('dimmed');
                    el.style.transform = "scale(1)";
                    el.style.zIndex = "1";
                }
            });
        }

        // Run
        renderTable();

    </script>
</body>
