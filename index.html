<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Precision Periodic Table</title>
    <style>
        /* --- General Layout --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212; /* Deep dark mode */
            color: #ecf0f1;
            margin: 0;
            padding: 20px;
        }

        h1 { text-align: center; margin-bottom: 5px; color: #fff; }
        p.subtitle { text-align: center; color: #aaa; margin-bottom: 25px; }

        /* --- Controls --- */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        #searchInput {
            padding: 12px 20px;
            border-radius: 25px;
            border: 2px solid #333;
            background: #1e1e1e;
            color: white;
            font-size: 1rem;
            outline: none;
            width: 300px;
            transition: border-color 0.3s;
        }
        #searchInput:focus { border-color: #3498db; }

        button#langBtn {
            padding: 12px 20px;
            border-radius: 25px;
            border: none;
            background: #3498db;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button#langBtn:hover { background: #2980b9; }

        /* --- Periodic Table Grid --- */
        .periodic-table-wrapper {
            overflow-x: auto;
            padding-bottom: 60px;
        }

        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 60px);
            grid-template-rows: repeat(10, 60px);
            gap: 4px;
            width: max-content;
            margin: 0 auto;
        }

        /* --- Element Card Styling --- */
        .element {
            background: #2c3e50;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, opacity 0.2s, z-index 0.2s;
            position: relative;
            user-select: none;
        }

        .element:hover {
            transform: scale(1.6);
            z-index: 100;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border-color: #fff;
        }

        .element.dimmed { opacity: 0.15; pointer-events: none; transform: scale(1); }

        .at-num { font-size: 8px; position: absolute; top: 2px; left: 3px; color: #bdc3c7; }
        .symbol { font-size: 16px; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); }
        .name { font-size: 7px; text-align: center; overflow: hidden; white-space: nowrap; width: 92%; text-overflow: ellipsis; }

        /* --- Category Colors --- */
        .cat-alkali { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .cat-alkaline { background: linear-gradient(135deg, #d35400, #a04000); }
        .cat-transition { background: linear-gradient(135deg, #34495e, #2c3e50); }
        .cat-post-trans { background: linear-gradient(135deg, #2980b9, #1f618d); }
        .cat-metalloid { background: linear-gradient(135deg, #1abc9c, #148f77); }
        .cat-non-metal { background: linear-gradient(135deg, #27ae60, #1e8449); }
        .cat-halogen { background: linear-gradient(135deg, #f1c40f, #d4ac0d); color: #222; }
        .cat-noble { background: linear-gradient(135deg, #8e44ad, #71368a); }
        .cat-lanthanide { background: linear-gradient(135deg, #ff9ff3, #c368cc); color: #222; }
        .cat-actinide { background: linear-gradient(135deg, #ffcccc, #cc8e90); color: #222; }

        .placeholder {
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: #555; border: 1px dashed #444; border-radius: 4px;
        }

        /* --- MODAL STYLING --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: #222;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            border: 1px solid #444;
            color: #fff;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #777;
            transition: color 0.2s;
        }
        .modal-close:hover { color: white; }

        .modal-header { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #333; }
        .modal-symbol { font-size: 3.5rem; font-weight: bold; padding: 10px 25px; border-radius: 8px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .modal-title h2 { margin: 0; font-size: 1.8rem; }
        .modal-cat { font-size: 0.9rem; text-transform: uppercase; color: #888; letter-spacing: 1px; }

        .modal-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .detail-item { display: flex; flex-direction: column; }
        .detail-item strong { font-size: 0.75rem; color: #3498db; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .detail-item span { font-size: 1.1rem; font-weight: 500; }
        
        .full-width { grid-column: span 2; }

        .wiki-btn {
            display: block;
            width: fit-content;
            margin: 0 auto;
            background: #3498db;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .wiki-btn:hover { background: #2980b9; transform: scale(1.05); }

    </style>
</head>

            if(n>=37 && n<=54) return [5, n-36];
            if(n>=55 && n<=56) return [6, n-54]; if(n>=72 && n<=86) return [6, n-68];
            if(n>=87 && n<=88) return [7, n-86]; if(n>=104 && n<=118) return [7, n-100];
            if(n>=57 && n<=71) return [9, n-54];
            if(n>=89 && n<=103) return [10, n-86];
            return [1,1];
        }

        // --- VALENCE CALCULATION (Group-based) ---
        function getValence(num) {
            const [row, col] = getPosition(num);
            if (num === 2) return 2; // Helium exception
            // Transition metals (Groups 3-12) -> Valence = Group # (Total outer electrons)
            if (col >= 3 && col <= 12) return col;
            // Main Group 1,2 -> 1,2
            if (col <= 2) return col;
            // Main Group 13-18 -> col - 10
            return col - 10;
        }

        // --- RENDER TABLE ---
        function renderTable() {
            const container = document.getElementById('tableGrid');
            container.innerHTML = `
                <div class="placeholder" style="grid-column: 3; grid-row: 6;">57-71</div>
                <div class="placeholder" style="grid-column: 3; grid-row: 7;">89-103</div>
            `;

            rawData.forEach(data => {
                const [num, sym, nameEn, namePl, cat] = data;
                const [row, col] = getPosition(num);
                const displayName = currentLang === 'en' ? nameEn : namePl;

                const el = document.createElement('div');
                el.className = `element ${cat}`;
                el.style.gridRow = row;
                el.style.gridColumn = col;
                
                el.dataset.nameEn = nameEn.toLowerCase();
                el.dataset.namePl = namePl.toLowerCase();
                el.dataset.sym = sym.toLowerCase();
                el.dataset.num = num;

                el.innerHTML = `<span class="at-num">${num}</span><span class="symbol">${sym}</span><span class="name">${displayName}</span>`;
                el.onclick = () => openModal(data);
                container.appendChild(el);
            });
        }

        // --- MODAL & LOGIC ---
        function openModal(data) {
            const [num, sym, nameEn, namePl, catClass, mass, neg, ox] = data;
            
            // Text Content
            document.getElementById('mSym').innerText = sym;
            document.getElementById('mName').innerText = currentLang === 'en' ? nameEn : namePl;
            document.getElementById('mCat').innerText = catClass.replace('cat-','').toUpperCase().replace('-',' ');
            document.getElementById('mNum').innerText = num;
            document.getElementById('mMass').innerText = mass;
            document.getElementById('mNeg').innerText = neg;
            document.getElementById('mOx').innerText = ox;

            // Valence
            const valVal = getValence(num);
            // Label customization for transition metals if needed, but Group # is standard total valence count
            document.getElementById('mVal').innerText = valVal;

            // Styling (Color Matching)
            const colorMap = getComputedStyle(document.querySelector(`.${catClass}`)).background;
            document.getElementById('mSym').style.background = colorMap;

            // Wikipedia Link
            const wikiLang = currentLang === 'en' ? 'en' : 'pl';
            document.getElementById('mWiki').href = `https://${wikiLang}.wikipedia.org/wiki/${currentLang === 'en' ? nameEn : namePl}`;
            document.getElementById('mWiki').innerText = currentLang === 'en' ? 'Wikipedia Article' : 'Artykuł na Wikipedii';

            // Labels translation
            const labels = currentLang === 'en' ? 
                ['Atomic Number', 'Atomic Mass', 'Valence', 'Electronegativity', 'Oxidation States'] : 
                ['Liczba atomowa', 'Masa atomowa', 'Wartościowość (Grupa)', 'Elektroujemność', 'Stopnie utlenienia'];
            
            ['lblNum', 'lblMass', 'lblVal', 'lblNeg', 'lblOx'].forEach((id, i) => {
                document.getElementById(id).innerText = labels[i];
            });

            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal(event) {
            if (event === 'force' || event.target.id === 'modalOverlay') {
                document.getElementById('modalOverlay').style.display = 'none';
            }
        }

        function toggleLanguage() {
            const btn = document.getElementById('langBtn');
            const title = document.getElementById('pageTitle');
            const subtitle = document.getElementById('pageSubtitle');
            const search = document.getElementById('searchInput');

            if (currentLang === 'en') {
                currentLang = 'pl';
                btn.textContent = 'English'; 
                title.textContent = 'Układ Okresowy Pierwiastków';
                subtitle.textContent = 'Pełne dane • Zweryfikowane z Wikipedią';
                search.placeholder = 'Szukaj...';
            } else {
                currentLang = 'en';
                btn.textContent = 'Polski';
                title.textContent = 'Periodic Table of Elements';
                subtitle.textContent = 'Comprehensive Data • Wikipedia Verified';
                search.placeholder = 'Search...';
            }
            renderTable();
            filterElements();
        }

        function filterElements() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const elements = document.querySelectorAll('.element');

            elements.forEach(el => {
                el.style.transform = ""; el.style.zIndex = "";
                const nameKey = currentLang === 'en' ? 'nameEn' : 'namePl';
                const match = el.dataset[nameKey].includes(query) || el.dataset.sym.includes(query) || el.dataset.num === query;
                if (query === "") el.classList.remove('dimmed');
                else if (match) el.classList.remove('dimmed');
                else el.classList.add('dimmed');
            });
        }

        renderTable();
    </script>
</body>
</html>
